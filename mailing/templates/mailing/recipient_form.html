<!-- recipient_form.html -->
{% extends "mailing/base.html" %}

{% block skystore %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">{% if object %}Редактировать{% else %}Добавить{% endif %} получателя</h1>
</div>
{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'mailing:mailing' %}">Назад</a>
</form>
{% endblock %}
