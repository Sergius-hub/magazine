<!-- mailing_form.html -->
{% extends "mailing/base.html" %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Создать{% endif %} рассылку</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
    <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'mailing:mailing' %}">Назад</a>
</form>
{% endblock %}
