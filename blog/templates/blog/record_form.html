{% extends "blog/base.html" %}
{% block skystore %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Новый блог</h1>
</div>
{% endblock %}
{% block content %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
        {% if object %}
            Сохранить
        {% else %}
            Создать
        {% endif %}
    </button>

</form>
{% endblock %}
