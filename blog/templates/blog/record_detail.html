{% extends 'blog/base.html' %}
{% load thumbnail %}
{% block skystore %}
{% endblock %}
{% block content %}
<div class="row" data-masonry='{"percentPosition": true }'>
    <div class="col">
        <div class="card border-0 shadow-sm">
            <img src="{{ object.image | thumbnail_url:'large' }}" class="card-img-top" alt="..."
                 style="width: 100%; height: auto; display: block;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <small class="text-muted"><i class="bi bi-calendar3"></i> {{ object.created_at }} </small>
                    <span class="badge bg-success">Туризм</span>
                </div>
                <h5 class="card-title">{{ object.title }}</h5>
                <p class="card-text text-muted">{{ object.content }}</p>
                <a class="btn btn-lg btn-block btn-outline-primary"
                   href="{% url 'blog:record_list' %}">Назад</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
