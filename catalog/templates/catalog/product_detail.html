{% extends 'catalog/base.html' %}
{% load thumbnail %}
{% block skystore%}
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
            </div>
            <div class="card-body">
                <img src="{{ product.image | thumbnail_url:'medium' }}"
                    class="card-img-top"
                    alt="{{ product.name }}">
                <h1 class="card-title pricing-card-title">{{ product.price }} руб. </h1>
                <p class="card-text">{{ product.description }}</p>
                <a class="btn btn-lg btn-block btn-outline-primary"
                   href="{% url 'catalog:home' %}">Назад</a>
                <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
